<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hasta Takip Sistemi</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#F3F6F5;
    --card:#FFFFFF;
    --line:#DCE6E3;
    --ink:#152524;
    --ink-muted:#5D716D;
    --teal:#115BA4;
    --teal-dark:#0C4178;
    --teal-soft:#E4ECF6;
    --amber:#B8791F;
    --amber-soft:#FBF0DC;
    --green:#2F7A52;
    --green-soft:#E4F3EA;
    --red:#B4432F;
    --red-soft:#FBE9E5;
    --radius:14px;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
  .app{max-width:720px;margin:0 auto;padding:0 0 40px;}

  header.top{background:linear-gradient(180deg,var(--teal) 0%,var(--teal-dark) 100%);color:#fff;padding:22px 20px 0;border-radius:0 0 22px 22px;}
  .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.75;font-weight:600;}
